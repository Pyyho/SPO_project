# Existing PostgreSQL connection. This configuration does not create a database.
# Use: docker compose -f compose.existing.yaml up -d --build
services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis_existing:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  app:
    build: .
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379
      API_INTERNAL_URL: http://127.0.0.1:3001
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      redis: { condition: service_healthy }
    restart: unless-stopped
    init: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
volumes:
  redis_existing:
