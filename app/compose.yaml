services:
  db:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: trips
      POSTGRES_USER: trip_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trip_app -d trips"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [internal]
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [internal]
  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://trip_app:${POSTGRES_PASSWORD}@db:5432/trips
      REDIS_URL: redis://redis:6379
      DB_SCHEMA: public
      API_INTERNAL_URL: http://127.0.0.1:3001
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped
    init: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    networks: [internal]
volumes:
  pgdata:
  redisdata:
networks:
  internal:
